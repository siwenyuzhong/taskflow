appId: com.pengcheng.taskflow
productName: Sloth
copyright: Copyright © 2026 Chen Weiyong

directories:
  output: release
  buildResources: build

# 直接复用 node_modules/electron/dist，避免打包时重复下载
electronDist: node_modules/electron/dist

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'

asar: true
compression: normal
npmRebuild: false

# 「工作速录」原生依赖 / worker 需解包出 asar：utilityProcess.fork 与原生 .node 加载
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-*/**
  - electron/workers/**

# 离线模型（ASR / VAD / 降噪）随包分发，运行时从 resourcesPath/models 读取
extraResources:
  - from: resources/models
    to: models

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  extendInfo:
    NSCameraUsageDescription: ''
    NSMicrophoneUsageDescription: 工作速录需要访问麦克风以录制音频（全程本地处理）
    NSAudioCaptureUsageDescription: 工作速录的「系统内录」需要捕获电脑正在播放的声音（如视频、会议），全程本地处理
    LSApplicationCategoryType: public.app-category.productivity
    NSHumanReadableCopyright: Copyright © 2026 Chen Weiyong

dmg:
  title: Sloth v20261022.1
  artifactName: Sloth-v20261022.1-${arch}.dmg
  window:
    width: 620
    height: 420
  contents:
    - x: 165
      y: 205
      type: file
    - x: 455
      y: 205
      type: link
      path: /Applications
